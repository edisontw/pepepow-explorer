name: Monitor API tests

on:
  pull_request:
    paths:
      - "monitor/**"
      - ".github/workflows/monitor-api-tests.yml"
  push:
    branches: [master]
    paths:
      - "monitor/**"
      - ".github/workflows/monitor-api-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install monitor dependencies
        run: python -m pip install -r monitor/requirements.txt

      - name: Compile monitor API
        run: python -m py_compile monitor/api/routes.py monitor/api/schemas.py

      - name: Run public-summary and schema tests
        run: python -m unittest monitor.tests.test_public_summary monitor.tests.test_schemas

name: Monitor tests

on:
  pull_request:
    paths:
      - 'monitor/**'
      - '.github/workflows/monitor-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'monitor/**'
      - '.github/workflows/monitor-tests.yml'

permissions:
  contents: read

jobs:
  monitor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Install monitor dependencies
        run: python -m pip install -r monitor/requirements.txt

      - name: Run monitor unit tests
        run: python -m unittest discover -s monitor/tests -p 'test_*.py'
